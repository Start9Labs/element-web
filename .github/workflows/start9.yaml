name: Start9
on:
    workflow_dispatch: {}
    push:
        branches: [master]
        tags: [v*]
    pull_request: {}
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
permissions: {}

jobs:
    jest:
        name: Jest (${{ matrix.shard }}/3)
        runs-on: ubuntu-24.04
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .node-version
                  cache: pnpm

            - run: pnpm install --frozen-lockfile
            - run: pnpm exec nx run element-web:test:unit:prepare
            - run: pnpm exec jest --ci --maxWorkers=50% --shard ${{ matrix.shard }}/3
              working-directory: apps/web
              env:
                  NODE_OPTIONS: --max_old_space_size=8192

    vitest:
        name: Vitest
        runs-on: ubuntu-24.04
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .node-version
                  cache: pnpm

            - run: pnpm install --frozen-lockfile
            - run: pnpm exec nx run element-web:test:unit:prepare
            - run: pnpm exec vitest run
              working-directory: apps/web

    docker:
        name: Docker image
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            packages: write
        env:
            IMAGE: ghcr.io/start9labs/element-web
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  # docker-package.sh takes the version from the nearest tag only on a detached HEAD
                  ref: ${{ github.sha }}
                  fetch-depth: 0
                  persist-credentials: false

            - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
            - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
              with:
                  install: true

            - name: Build and load
              uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7
              with:
                  source: .
                  files: ./docker-bake.hcl
                  targets: element-web
                  load: true
                  set: |
                      element-web.tags=${{ env.IMAGE }}:test

            - name: Smoke test
              timeout-minutes: 2
              run: |
                  set -x
                  ELEMENT_WEB_PORT=8181
                  CONTAINER_ID=$(docker run --rm -e "ELEMENT_WEB_PORT=$ELEMENT_WEB_PORT" -dp "$ELEMENT_WEB_PORT:$ELEMENT_WEB_PORT" "$IMAGE:test")
                  wget --retry-connrefused --tries=5 -q --wait=3 --spider "http://localhost:$ELEMENT_WEB_PORT/config.json"
                  wget -q -O - "http://localhost:$ELEMENT_WEB_PORT/version"
                  until test "$(docker inspect -f '{{.State.Health.Status}}' "$CONTAINER_ID")" == "healthy"; do
                      sleep 1
                  done
                  docker stop "$CONTAINER_ID"

            - name: Docker meta
              id: meta
              if: github.event_name != 'pull_request'
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
              with:
                  images: ${{ env.IMAGE }}
                  tags: |
                      type=ref,event=branch
                      type=sha
                  bake-target: docker-metadata-action

            - name: Login to GitHub Container Registry
              if: github.event_name != 'pull_request'
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              if: github.event_name != 'pull_request'
              uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7
              with:
                  source: .
                  files: |
                      ./docker-bake.hcl
                      ${{ steps.meta.outputs.bake-file }}
                  targets: element-web
                  push: true
                  vars: |
                      PLATFORMS=linux/amd64,linux/arm64

    release:
        name: Release tag
        if: github.ref_type == 'tag'
        needs: [jest, vitest, docker]
        runs-on: ubuntu-24.04
        permissions:
            packages: write
        env:
            IMAGE: ghcr.io/start9labs/element-web
        steps:
            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Tag the tested image
              run: docker buildx imagetools create -t "$IMAGE:$GITHUB_REF_NAME" -t "$IMAGE:latest" "$IMAGE:sha-${GITHUB_SHA::7}"
